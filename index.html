<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital@0;1&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png"> 
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="styles.css" />
<title>Frontend Mentor | IP Address Tracker</title>

</head>
<body>

<main>
  <section class="ip-info">
  <h1>IP Address Tracker</h1>

  <div class="input-text">
    <input type="text" name="search-ip" id="search-ip" placeholder="Search for any IP address or domain">
    <button type="button" class="btn">
      <img src="images/icon-arrow.svg" alt="btn-image">
    </button>
  </div>
  <div class="ip-box">
    <div class="location-info">    
      <span>IP ADDRESS</span>
      <p class="ip">192.212.174.101</p>
    </div>
    <span class="row-diviser"></span>
  <div class="location-info">
   <span>LOCATION</span>
    <p class="location">Brooklyn, NY 10001</p>
  </div>
  <span class="row-diviser"></span>
   <div class="location-info">
      <span>TIMEZONE</span>
      <p class="timezone">UTC -05:00</p>
   </div>
   <span class="row-diviser"></span>
    <div class="location-info">
        <span>ISP</span>
      <p class="isp">SpaceX Starlink</p>
    </div>
  </div>
</section>
 <section class="map-section">
      <div id="map"></div>
    </section>
</main>

 <script type="module" src="main.js"></script>
 <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</body>
</html>
